name: APX CI

concurrency:
  group: apx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run focused observability and security regressions
        run: |
          python -m pytest \
            apx/tests/test_api.py \
            apx/tests/test_tracing.py \
            apx/tests/test_persistence.py \
            apx/tests/test_phase4_guardrail.py \
            apx/tests/test_phase4_action.py \
            apx/tests/test_security_redaction.py -q
      - name: Run complete test suite
        run: |
          mkdir -p artifacts
          python -m pytest apx/tests -q --junitxml=artifacts/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apx-test-results
          path: artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  benchmark:
    name: Deterministic development benchmark
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run six-layer development benchmark
        run: python -m apx.evaluation.benchmark --tier dev --seed 42 --output artifacts/benchmark
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apx-benchmark-evidence
          path: artifacts/benchmark/
          if-no-files-found: ignore
          retention-days: 30

  lint:
    name: Ruff lint for audited security files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.5"
      - name: Lint changed redaction implementation and regression tests
        run: ruff check --select F apx/observability/redaction.py apx/tests/test_security_redaction.py
